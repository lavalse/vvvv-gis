name: Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore VL.GIS.sln

      # Must run before validation: the validator reads the built assemblies to check
      # each one carries a VL.Core import attribute.
      - name: Build
        run: dotnet build VL.GIS.sln --no-restore -c Release

      # Does the arithmetic come out right. Complements the structural validation below,
      # which only proves the package loads and contributes nodes.
      - name: Test
        run: dotnet test VL.GIS.sln --no-build -c Release --verbosity normal

      # Replaces the old inline checks, which passed every one of the broken 0.0.x
      # releases. See tools/Test-VLPackage.ps1 for what each assertion is guarding.
      - name: Validate package structure
        shell: pwsh
        run: ./tools/Test-VLPackage.ps1 -FromBuildOutput

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      # Every .vl at the root with a matching .nuspec, discovered the same way build.ps1 and
      # Test-VLPackage.ps1 discover them, so a new package is covered without editing this.
      - name: Pack
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem . -Filter '*.vl' -File |
            Where-Object { Test-Path "$($_.BaseName).nuspec" } |
            ForEach-Object {
              nuget pack "$($_.BaseName).nuspec" -OutputDirectory nupkg/
              if ($LASTEXITCODE -ne 0) { throw "nuget pack failed for $($_.BaseName)" }
            }

      - name: Validate packed contents
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          foreach ($vlFile in Get-ChildItem . -Filter '*.vl' -File | Where-Object { Test-Path "$($_.BaseName).nuspec" }) {
            $name  = $vlFile.BaseName
            $nupkg = Get-Item "nupkg\$name.*.nupkg" | Select-Object -First 1
            if (-not $nupkg) { throw "No .nupkg produced for $name" }

            $zip = [IO.Compression.ZipFile]::OpenRead($nupkg.FullName)
            try   { $entries = $zip.Entries | ForEach-Object { $_.FullName } }
            finally { $zip.Dispose() }

            # Derived from the .vl rather than hardcoded, so adding an assembly cannot leave
            # this list stale (an older hardcoded list still named VL.GIS.Stride).
            [xml]$vl = Get-Content $vlFile.FullName -Raw
            $required = @("$name.vl") + @(
              $vl.DocumentElement.ChildNodes |
                Where-Object { $_.LocalName -eq 'PlatformDependency' } |
                ForEach-Object { $_.Attributes['Location'].Value } |
                Where-Object { $_ -like './lib/*' } |
                ForEach-Object { $_ -replace '^\./', '' }
            )

            $missing = $required | Where-Object { $_ -notin $entries }
            if ($missing) { throw "Missing from $name : $($missing -join ', ')" }
            $required | ForEach-Object { Write-Host "  ok  $name -> $_" }
          }

      - name: Upload nupkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: VL.GIS-nupkg
          path: nupkg/*.nupkg
