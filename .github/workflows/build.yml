name: Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore VL.GIS.sln

      # Must run before validation: the validator reads the built assemblies to check
      # each one carries a VL.Core import attribute.
      - name: Build
        run: dotnet build VL.GIS.sln --no-restore -c Release

      # Replaces the old inline checks, which passed every one of the broken 0.0.x
      # releases. See tools/Test-VLPackage.ps1 for what each assertion is guarding.
      - name: Validate package structure
        shell: pwsh
        run: ./tools/Test-VLPackage.ps1 -FromBuildOutput

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Pack
        run: nuget pack VL.GIS.nuspec -OutputDirectory nupkg/

      - name: Validate packed contents
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nupkg = Get-Item nupkg\*.nupkg | Select-Object -First 1
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($nupkg.FullName)
          try   { $entries = $zip.Entries | ForEach-Object { $_.FullName } }
          finally { $zip.Dispose() }

          # Derived from VL.GIS.vl rather than hardcoded, so adding an assembly cannot
          # leave this list stale (the old hardcoded list still named VL.GIS.Stride).
          [xml]$vl = Get-Content VL.GIS.vl -Raw
          $required = @('VL.GIS.vl') + @(
            $vl.DocumentElement.ChildNodes |
              Where-Object { $_.LocalName -eq 'PlatformDependency' } |
              ForEach-Object { $_.Attributes['Location'].Value } |
              Where-Object { $_ -like './lib/*' } |
              ForEach-Object { $_ -replace '^\./', '' }
          )

          $missing = $required | Where-Object { $_ -notin $entries }
          if ($missing) { throw "Missing from package: $($missing -join ', ')" }
          $required | ForEach-Object { Write-Host "  ok  $_" }

      - name: Upload nupkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: VL.GIS-nupkg
          path: nupkg/*.nupkg
